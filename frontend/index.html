<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduNexa</title>
    <meta name="description" content="EduNexa - Connect your habits. Predict your success.">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="apple-touch-icon" href="/static/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: {
                        bg: 'var(--color-bg)',
                        surface: 'var(--color-surface)',
                        surfaceHover: 'var(--color-surface-hover)',
                        border: 'var(--color-border)',
                        text: 'var(--color-text)',
                        textMuted: 'var(--color-text-muted)',
                        primary: 'var(--color-primary)',
                        primaryHover: 'var(--color-primary-hover)',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root[data-theme="dark"] {
            --color-bg: #0f172a;
            --color-surface: rgba(30, 41, 59, 0.7);
            --color-surface-hover: rgba(51, 65, 85, 0.8);
            --color-border: rgba(71, 85, 105, 0.5);
            --color-text: #f8fafc;
            --color-text-muted: #94a3b8;
            --color-primary: #3b82f6;
            --color-primary-hover: #2563eb;
            --shadow-glass: 0 4px 30px rgba(0, 0, 0, 0.3);
            --chart-grid: rgba(255, 255, 255, 0.1);
            --heatmap-0: transparent;
            --input-bg: #1e293b;
            --brand-text: #f8fafc;
        }

        :root[data-theme="light"] {
            --color-bg: #f1f5f9;
            --color-surface: rgba(255, 255, 255, 0.9);
            --color-surface-hover: rgba(241, 245, 249, 1);
            --color-border: rgba(203, 213, 225, 0.8);
            --color-text: #0f172a;
            --color-text-muted: #475569;
            --color-primary: #3b82f6;
            --color-primary-hover: #2563eb;
            --shadow-glass: 0 8px 32px rgba(148, 163, 184, 0.2);
            --chart-grid: rgba(0, 0, 0, 0.05);
            --heatmap-0: transparent;
            --input-bg: #ffffff;
            --brand-text: #0f172a;
        }

        html { scroll-behavior: smooth; }
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: var(--color-bg); 
            color: var(--color-text);
            transition: background-color 0.3s, color 0.3s; 
            overflow-x: hidden;
        }
        
        .glass-card {
            background: var(--color-surface);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow-glass);
            border-radius: 1rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.3s, border-color 0.3s;
        }
        
        .fade-in { opacity: 0; transform: translateY(10px); animation: fadeIn 0.4s forwards; }
        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

        /* Loader */
        #loader {
            position: fixed; inset: 0; background: var(--color-bg); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        .pulse-anim { animation: pulse 2s infinite ease-in-out; }
        @keyframes pulse { 0% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(0.95); opacity: 0.8; } }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: var(--color-primary); cursor: pointer; margin-top: -6px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: var(--color-border); border-radius: 2px; }
        input:not([type=range]), select { background: var(--input-bg); border: 1px solid var(--color-border); color: var(--color-text); }
        table th, table td { border-bottom: 1px solid var(--color-border); }
        tr:hover { background-color: var(--color-surface-hover); }

        .nav-item { padding: 0.75rem 1rem; border-radius: 0.5rem; transition: all 0.2s; display: flex; align-items: center; gap: 0.75rem; color: var(--color-text-muted); }
        .nav-item:hover { background: var(--color-surface-hover); color: var(--color-text); }
        .nav-item.active { background: rgba(59, 130, 246, 0.1); color: var(--color-primary); font-weight: 500; }
        
        @media print {
            body { background: white !important; color: black !important; }
            .no-print, #sidebar, #topbar { display: none !important; }
            #main-content { margin-left: 0 !important; margin-top: 0 !important; }
            .glass-card { box-shadow: none !important; border: 1px solid #ccc !important; break-inside: avoid; background: white !important; color: black !important; }
            .print-color-adjust { color-adjust: exact; -webkit-print-color-adjust: exact; }
            .monochrome-logo polygon, .monochrome-logo line, .monochrome-logo circle { fill: #000 !important; stroke: #000 !important; filter: none !important; }
        }

        @media (prefers-reduced-motion: no-preference) {
            .nexa-logo-anim {
                animation: nexaFloatTilt 4s ease-in-out infinite;
                transform-origin: center;
            }
            @keyframes nexaFloatTilt {
                0%, 100% { transform: translateY(0) rotate(0deg); }
                50% { transform: translateY(-8px) rotate(3deg); }
            }

            .nexa-circle-anim-1 {
                animation: nexaCircleFloat1 3.5s ease-in-out infinite;
                transform-origin: 25px 80px;
            }
            @keyframes nexaCircleFloat1 {
                0%, 100% { transform: scale(1); }
                50% { transform: scale(1.2); }
            }

            .nexa-circle-anim-2 {
                animation: nexaCircleFloat2 4s ease-in-out infinite 1s;
                transform-origin: 75px 35px;
            }
            @keyframes nexaCircleFloat2 {
                0%, 100% { transform: scale(1); }
                50% { transform: scale(1.2); }
            }

            .nexa-glow-pulse {
                animation: nexaGlowPulse 4s ease-in-out infinite;
            }
            @keyframes nexaGlowPulse {
                0%, 100% { filter: drop-shadow(0 0 2px rgba(59, 130, 246, 0.2)); }
                50% { filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.6)); }
            }

            .nexa-text-glow {
                animation: nexaTextPulse 4s ease-in-out infinite;
                display: inline-block;
            }
            @keyframes nexaTextPulse {
                0%, 100% { filter: drop-shadow(0 0 1px rgba(59, 130, 246, 0.1)); }
                50% { filter: drop-shadow(0 0 6px rgba(59, 130, 246, 0.3)); }
            }
        }
    </style>
</head>
<body>
    <div id="loader">
        <div class="pulse-anim flex flex-col items-center">
            <svg viewBox="0 0 100 100" width="80" height="80">
                <defs>
                    <linearGradient id="nexaGradLoad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#3B82F6"/>
                        <stop offset="50%" stop-color="#14B8A6"/>
                        <stop offset="100%" stop-color="#8B5CF6"/>
                    </linearGradient>
                    <filter id="glowLoad">
                        <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                        <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                </defs>
                <polygon points="50,15 85,30 50,45 15,30" fill="url(#nexaGradLoad)" filter="url(#glowLoad)"/>
                <line x1="25" y1="35" x2="25" y2="80" stroke="url(#nexaGradLoad)" stroke-width="8" stroke-linecap="round"/>
                <circle cx="25" cy="80" r="6" fill="#14B8A6"/>
                <line x1="25" y1="40" x2="75" y2="75" stroke="url(#nexaGradLoad)" stroke-width="8" stroke-linecap="round"/>
                <line x1="75" y1="35" x2="75" y2="80" stroke="url(#nexaGradLoad)" stroke-width="8" stroke-linecap="round"/>
                <circle cx="75" cy="35" r="6" fill="#8B5CF6"/>
            </svg>
            <div class="mt-4 font-bold text-2xl text-text">Edu<span class="bg-clip-text text-transparent bg-gradient-to-r from-blue-500 via-teal-400 to-violet-500">Nexa</span></div>
        </div>
    </div>

    <div id="app"></div>

    <script>
        const API_BASE = '/api';
        let charts = {};
        let cachedData = null;
        
        const nexaIconSVG = `
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="w-full h-full monochrome-logo nexa-logo-anim nexa-glow-pulse">
                <defs>
                    <linearGradient id="nexaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#3B82F6"/><stop offset="50%" stop-color="#14B8A6"/><stop offset="100%" stop-color="#8B5CF6"/>
                    </linearGradient>
                    <filter id="glowNexa">
                        <feGaussianBlur stdDeviation="2" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                </defs>
                <polygon points="50,15 85,30 50,45 15,30" fill="url(#nexaGrad)" filter="url(#glowNexa)"/>
                <line x1="25" y1="35" x2="25" y2="80" stroke="url(#nexaGrad)" stroke-width="8" stroke-linecap="round"/>
                <circle cx="25" cy="80" r="6" fill="#14B8A6" class="nexa-circle-anim-1"/>
                <line x1="25" y1="40" x2="75" y2="75" stroke="url(#nexaGrad)" stroke-width="8" stroke-linecap="round"/>
                <line x1="75" y1="35" x2="75" y2="80" stroke="url(#nexaGrad)" stroke-width="8" stroke-linecap="round"/>
                <circle cx="75" cy="35" r="6" fill="#8B5CF6" class="nexa-circle-anim-2"/>
            </svg>
        `;
        const nexaWordmark = `<span class="nexa-text-glow"><span style="color: var(--brand-text)">Edu</span><span class="bg-clip-text text-transparent bg-gradient-to-r from-blue-500 via-teal-400 to-violet-500">Nexa</span></span>`;

        function hideLoader() { document.getElementById('loader').style.opacity = '0'; setTimeout(()=>document.getElementById('loader').style.visibility='hidden', 500); }
        function showLoader() { document.getElementById('loader').style.visibility = 'visible'; document.getElementById('loader').style.opacity = '1'; }

        function getToken() { return localStorage.getItem('edunexa_token'); }
        function getUser() { return JSON.parse(localStorage.getItem('edunexa_user') || '{}'); }
        
        async function fetchAuth(url, options = {}) {
            const token = getToken();
            const headers = { ...options.headers };
            if (token) headers['Authorization'] = `Bearer ${token}`;
            if (!options.body || typeof options.body === 'string') headers['Content-Type'] = 'application/json';
            const res = await fetch(API_BASE + url, { ...options, headers });
            if (res.status === 401) { executeLogout(null); throw new Error('Unauthorized'); }
            return res;
        }

        function confirmLogout() {
            const user = getUser();
            document.getElementById('logout-user-info').innerText = `Signed in as ${user.name || user.email}`;
            const modal = document.getElementById('logout-modal');
            const backdrop = document.getElementById('logout-backdrop');
            const content = document.getElementById('logout-content');
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden';
            
            requestAnimationFrame(() => {
                backdrop.classList.remove('opacity-0');
                content.classList.remove('scale-95', 'opacity-0');
            });
            
            document.addEventListener('keydown', handleModalKeydown);
            document.getElementById('logout-cancel').focus();
        }

        function hideLogoutModal() {
            const modal = document.getElementById('logout-modal');
            const backdrop = document.getElementById('logout-backdrop');
            const content = document.getElementById('logout-content');
            
            backdrop.classList.add('opacity-0');
            content.classList.add('scale-95', 'opacity-0');
            document.removeEventListener('keydown', handleModalKeydown);
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                document.body.style.overflow = '';
            }, 200);
        }

        function handleModalKeydown(e) {
            if (e.key === 'Escape') hideLogoutModal();
            if (e.key === 'Tab') {
                const focusable = document.getElementById('logout-content').querySelectorAll('button');
                if(focusable.length === 0) return;
                const first = focusable[0];
                const last = focusable[focusable.length - 1];
                if (e.shiftKey && document.activeElement === first) {
                    e.preventDefault(); last.focus();
                } else if (!e.shiftKey && document.activeElement === last) {
                    e.preventDefault(); first.focus();
                }
            }
        }

        async function executeLogout(btn) {
            if(btn) {
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Logging out...';
                btn.disabled = true;
            }
            try {
                const token = getToken();
                if(token) await fetch(API_BASE + '/logout', { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } });
            } catch(e) {}
            
            localStorage.removeItem('edunexa_token'); 
            localStorage.removeItem('edunexa_user'); 
            cachedData = null; 
            
            if(btn) hideLogoutModal();
            navigate('login');
            
            if(btn) {
                setTimeout(() => {
                    showToast("You have been logged out successfully.");
                }, 100);
            }
        }

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'glass-card px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 transform translate-y-10 opacity-0 transition-all text-sm font-medium border-l-4 border-green-500 text-text';
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-green-500"></i> ${msg}`;
            container.appendChild(toast);
            
            requestAnimationFrame(() => toast.classList.remove('translate-y-10', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function preloadData(force = false) {
            if (!cachedData || force) {
                const dataRes = await fetchAuth('/data').then(r => r.json());
                const descRes = await fetchAuth('/descriptive').then(r => r.json());
                const probRes = await fetchAuth('/probability').then(r => r.json());
                const hypRes = await fetchAuth('/hypothesis-testing').then(r => r.json());
                const corrRes = await fetchAuth('/correlation').then(r => r.json());
                const regRes = await fetchAuth('/regression').then(r => r.json());
                
                cachedData = { raw: dataRes.data, desc: descRes, prob: probRes, hyp: hypRes, corr: corrRes, reg: regRes };
            }
            return cachedData;
        }

        function renderAuthLayout(content) {
            return `
            <div class="flex min-h-screen bg-bg">
                <div class="hidden lg:flex lg:w-1/2 items-center justify-center p-12 relative overflow-hidden" style="background: var(--color-bg)">
                    <div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(var(--color-text) 1px, transparent 1px); background-size: 20px 20px;"></div>
                    <div class="z-10 text-center">
                        <div class="w-40 h-40 mx-auto mb-6">${nexaIconSVG}</div>
                        <h1 class="text-5xl font-bold mb-4 tracking-tight font-sans">${nexaWordmark}</h1>
                        <p class="text-textMuted text-lg font-medium">Connect your habits. Predict your success.</p>
                    </div>
                </div>
                <div class="w-full lg:w-1/2 flex items-center justify-center p-8 border-l border-border bg-surface">
                    <div class="w-full max-w-md p-8 fade-in">
                        ${content}
                    </div>
                </div>
            </div>`;
        }

        function renderMainLayout(content, title, desc) {
            const user = getUser();
            return `
            <div class="flex min-h-screen bg-bg">
                <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-surface border-r border-border z-40 transform -translate-x-full md:translate-x-0 transition-transform no-print flex flex-col">
                    <div class="p-6 flex items-center gap-3">
                        <div class="w-8 h-8">${nexaIconSVG}</div>
                        <span class="font-bold text-xl tracking-tight">${nexaWordmark}</span>
                    </div>
                    <nav class="flex-1 px-4 space-y-2 mt-4 overflow-y-auto">
                        <a href="#dashboard" class="nav-item ${location.hash==='#dashboard'?'active':''}"><i class="fa-solid fa-house w-5"></i> Dashboard</a>
                        <a href="#data" class="nav-item ${location.hash==='#data'?'active':''}"><i class="fa-solid fa-database w-5"></i> Data Manager</a>
                        <a href="#habits" class="nav-item ${location.hash==='#habits'?'active':''}"><i class="fa-solid fa-brain w-5"></i> Study Habits</a>
                        <a href="#probabilities" class="nav-item ${location.hash==='#probabilities'?'active':''}"><i class="fa-solid fa-dice w-5"></i> Probabilities</a>
                        <a href="#hypothesis" class="nav-item ${location.hash==='#hypothesis'?'active':''}"><i class="fa-solid fa-scale-balanced w-5"></i> Hypothesis Tests</a>
                        <a href="#predictor" class="nav-item ${location.hash==='#predictor'?'active':''}"><i class="fa-solid fa-wand-magic-sparkles w-5"></i> Predictor</a>
                        <a href="#reports" class="nav-item ${location.hash==='#reports'?'active':''}"><i class="fa-solid fa-download w-5"></i> Reports</a>
                    </nav>
                    <div class="p-4 border-t border-border text-xs text-textMuted text-center">
                        &copy; 2026 EduNexa. All rights reserved.
                    </div>
                </aside>
                
                <div id="main-content" class="flex-1 md:ml-64 flex flex-col min-h-screen w-full">
                    <header id="topbar" class="h-16 border-b border-border glass-card rounded-none flex items-center justify-between px-6 sticky top-0 z-30 no-print">
                        <div class="flex items-center gap-4">
                            <button onclick="document.getElementById('sidebar').classList.toggle('-translate-x-full')" class="md:hidden text-textMuted hover:text-text">
                                <i class="fa-solid fa-bars text-xl"></i>
                            </button>
                            <h2 class="font-semibold text-lg text-text">${title}</h2>
                        </div>
                        <div class="flex items-center gap-4">
                            <button onclick="toggleTheme()" class="text-textMuted hover:text-text transition">
                                <i class="fa-solid ${document.documentElement.dataset.theme === 'dark' ? 'fa-moon' : 'fa-sun text-yellow-500'} text-lg" id="theme-icon"></i>
                            </button>
                            <div class="relative group cursor-pointer">
                                <div class="flex items-center gap-2 bg-surface rounded-full px-3 py-1.5 border border-border">
                                    <div class="w-7 h-7 rounded-full bg-primary text-white flex items-center justify-center text-xs font-bold">${user.name ? user.name[0].toUpperCase() : 'U'}</div>
                                    <span class="text-sm font-medium hidden sm:block text-text">${user.name}</span>
                                    <i class="fa-solid fa-chevron-down text-xs text-textMuted"></i>
                                </div>
                                <div class="absolute right-0 mt-2 w-48 glass-card rounded-lg opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all">
                                    <div class="p-4 border-b border-border text-text">
                                        <p class="font-medium text-sm">${user.name}</p>
                                        <p class="text-xs text-textMuted truncate">${user.email}</p>
                                    </div>
                                    <button onclick="confirmLogout()" class="w-full text-left px-4 py-3 text-sm text-red-500 hover:bg-surfaceHover transition flex items-center gap-2 rounded-b-lg">
                                        <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
                                    </button>
                                </div>
                            </div>
                        </div>
                    </header>
                    <main class="p-6 md:p-8 flex-1 fade-in">
                        ${desc ? `<p class="text-textMuted mb-8 no-print">${desc}</p>` : ''}
                        ${content}
                    </main>
                </div>
            </div>`;
        }

        async function renderLogin() {
            const html = `
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-bold mb-2 text-text">Welcome Back</h2>
                    <p class="text-textMuted text-sm">Sign in to your EduNexa account</p>
                </div>
                <form id="login-form" class="space-y-4">
                    <div>
                        <label class="block text-sm mb-1 text-text">Email</label>
                        <input type="email" id="l-email" required class="w-full rounded-lg px-4 py-2 outline-none focus:border-primary">
                        <p id="l-email-error" class="text-red-500 text-sm hidden mt-1"></p>
                    </div>
                    <div class="relative">
                        <label class="block text-sm mb-1 text-text">Password</label>
                        <input type="password" id="l-password" required class="w-full rounded-lg px-4 py-2 outline-none pr-10 focus:border-primary">
                        <i class="fa-solid fa-eye absolute right-3 top-9 text-textMuted cursor-pointer" onclick="togglePass('l-password')"></i>
                    </div>
                    <p id="l-error" class="text-red-500 text-sm hidden"></p>
                    <button type="submit" id="l-btn" class="w-full bg-primary hover:bg-primaryHover text-white font-semibold py-2 rounded-lg transition mt-4">Sign In</button>
                </form>
                <p class="text-center text-sm text-textMuted mt-6">Don't have an account? <a href="#register" class="text-primary hover:underline">Register</a></p>
            `;
            document.getElementById('app').innerHTML = renderAuthLayout(html);
            
            const emailInput = document.getElementById('l-email');
            const emailError = document.getElementById('l-email-error');
            const submitBtn = document.getElementById('l-btn');

            function validateEmail() {
                const val = emailInput.value.trim();
                
                if (!val) {
                    emailError.innerText = "Email field is required";
                    emailError.classList.remove('hidden');
                    submitBtn.disabled = true;
                    submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    return false;
                }
                
                if (!val.endsWith('@gmail.com')) {
                    emailError.innerText = "Only Gmail accounts are allowed. Please enter an email ending with @gmail.com";
                    emailError.classList.remove('hidden');
                    submitBtn.disabled = true;
                    submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    return false;
                }

                const gmailRegex = /^[a-zA-Z0-9._%+-]+@gmail\.com$/;
                if (!gmailRegex.test(val)) {
                    emailError.innerText = "Invalid email format. Use example@gmail.com";
                    emailError.classList.remove('hidden');
                    submitBtn.disabled = true;
                    submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    return false;
                }

                emailError.innerText = "";
                emailError.classList.add('hidden');
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                return true;
            }

            emailInput.addEventListener('input', validateEmail);
            
            document.getElementById('login-form').onsubmit = async (e) => {
                e.preventDefault();
                if (!validateEmail()) return;
                
                submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
                try {
                    const res = await fetch(API_BASE + '/login', { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email: emailInput.value, password: document.getElementById('l-password').value}) });
                    const data = await res.json();
                    if(!res.ok) throw new Error(data.detail || 'Login failed');
                    localStorage.setItem('edunexa_token', data.token);
                    localStorage.setItem('edunexa_user', JSON.stringify({name: data.name, email: data.email}));
                    navigate('dashboard');
                } catch(err) {
                    document.getElementById('l-error').innerText = err.message;

        async function renderHypothesis() {
            const data = await preloadData();
            const h = data.hyp;
            const fP = p => p < 0.0001 ? '< 0.0001' : p.toFixed(4);
            
            let tTestTail = 'two';
            let zTestTail = 'two';
            
            function getPVal(res, tail) {
                if(!res.valid) return 1.0;
                if(tail === 'two') return res.p_two;
                if(tail === 'right') return res.p_right;
                if(tail === 'left') return res.p_left;
            }
            
            function getConclusion(p) {
                return p < 0.05 ? 'Reject H0' : 'Fail to reject H0';
            }
            
            function getBadge(p, type) {
                if(type === 'sig') return p < 0.05 ? '<span class="text-xs font-bold px-2 py-1 rounded text-white bg-green-500">Significant</span>' : '<span class="text-xs font-bold px-2 py-1 rounded text-white bg-red-500">Not Significant</span>';
                if(type === 'dep') return p < 0.05 ? '<span class="text-xs font-bold px-2 py-1 rounded text-white bg-green-500">Dependent</span>' : '<span class="text-xs font-bold px-2 py-1 rounded text-white bg-red-500">Independent</span>';
            }
            
            function getBox(p, conclusion) {
                if(p < 0.05) return `<p class="font-medium p-3 rounded border border-green-500 bg-green-500/10 text-green-600 dark:text-green-400">Conclusion: ${conclusion}.</p>`;
                return `<p class="font-medium p-3 rounded border border-red-500 bg-red-500/10 text-red-600 dark:text-red-400">Conclusion: ${conclusion}.</p>`;
            }

                if(tTestTail === 'left') { tH0 = 'H0: &mu;1 &ge; &mu;2'; tH1 = 'H1: &mu;1 &lt; &mu;2'; tLabel = 'One-tailed (Left)'; }

                document.getElementById('t-stats').innerText = h.t_test.valid ? `P-value: ${fP(pT)} | T-Stat: ${h.t_test.t_statistic}` : '';
                document.getElementById('t-h0').innerHTML = tH0;

                document.getElementById('z-badge').innerHTML = h.z_test_proportions.valid ? getBadge(pZ, 'sig') : '<span class="text-xs font-bold px-2 py-1 rounded text-white bg-gray-500">Error</span>';
                document.getElementById('z-box').innerHTML = h.z_test_proportions.valid ? getBox(pZ, getConclusion(pZ)) : `<p class="text-red-500">${h.z_test_proportions.error_msg}</p>`;

                        </div>
                        <div id="c-badge">${h.chi_square.valid ? getBadge(h.chi_square.p_value, 'dep') : '<span class="text-xs font-bold px-2 py-1 rounded text-white bg-gray-500">Error</span>'}</div>
                    </div>
                    <p class="text-sm text-primary font-medium mb-3 w-max cursor-help" title="These tests use the F/Chi-square distribution which are inherently right-tailed.">Tail used: Right-tailed (fixed) &#9432;</p>

                        <p>H0: Attendance & Pass Rate are independent</p>

                    </div>
                    <div class="mt-auto">
                        <div id="c-box">${h.chi_square.valid ? getBox(h.chi_square.p_value, h.chi_square.p_value < 0.05 ? 'Reject H0 (Dependent)' : 'Fail to reject H0 (Independent)') : `<p class="text-red-500">${h.chi_square.error_msg}</p>`}</div>
                        <p id="c-stats" class="text-xs text-textMuted mt-4 font-mono">${h.chi_square.valid ? `P-value: ${fP(h.chi_square.p_value)} | Chi&sup2;: ${h.chi_square.chi2_statistic}` : ''}</p>
                    </div>
                </div>
                
                <div class="glass-card p-6 relative overflow-hidden flex flex-col">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <h3 class="font-semibold text-lg mb-1">Variance (ANOVA)</h3>
                        </div>

                    <div class="mt-auto">
                        <div id="a-box">${h.anova.valid ? getBox(h.anova.p_value, h.anova.p_value < 0.05 ? 'Reject H0' : 'Fail to reject H0') : `<p class="text-red-500">${h.anova.error_msg}</p>`}</div>

                    </div>
                </div>
            </div>`;
            
            document.getElementById('app').innerHTML = renderMainLayout(htmlStr, 'Hypothesis Testing', 'Statistical significance tests validating assumptions.');
            
            updateUI();

        // --- Helpers ---
        function downloadSample100() {
            let csv = "student_id,study_hours,attendance,sleep_hours,marks\n";
            for(let i=1; i<=100; i++) {
                const randNormal = () => { let u = 0; for(let j=0; j<6; j++) u += Math.random(); return u - 3; };
                let study = Math.min(12, Math.max(1, 5 + randNormal() * 2));
                let att = Math.min(100, Math.max(40, 80 + randNormal() * 12));
                let sleep = Math.min(10, Math.max(4, 7 + randNormal() * 1.2));
                let noise = randNormal() * 6;
                let marks = Math.min(100, Math.max(0, 5 + (study * 4.5) + (att * 0.45) + noise));
                csv += `${i},${study.toFixed(1)},${Math.round(att)},${sleep.toFixed(1)},${marks.toFixed(1)}\n`;
            }
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'sample_students_100.csv';
            document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        }

        function toggleTheme() {
            const el = document.documentElement;

            el.dataset.theme = newTheme;
            localStorage.setItem('edunexa_theme', newTheme);

            let chart = c || charts['c-gauge'];

                chart.data.datasets[0].backgroundColor[1] = getEmptyGaugeColor();

        // --- Router ---
        async function router() {
            const hash = location.hash.replace('#', '') || 'dashboard';
            const token = getToken();
            
            if (token && !cachedData) {
                showLoader();
                try {
                    await preloadData();
                } catch(e) {
                    // loader handles error or logout
                }
                hideLoader();
            }

            if (!token && hash !== 'login' && hash !== 'register') { hideLoader(); return navigate('login'); }
            if (token && (hash === 'login' || hash === 'register')) { hideLoader(); return navigate('dashboard'); }
            
            try {
                if (hash === 'login') await renderLogin();
                else if (hash === 'register') await renderRegister();
                else if (hash === 'dashboard') await renderDashboard();
                else if (hash === 'data') await renderData();
                else if (hash === 'habits') await renderHabits();
                else if (hash === 'probabilities') await renderProbabilities();
                else if (hash === 'hypothesis') await renderHypothesis();
                else if (hash === 'predictor') await renderPredictor();
                else if (hash === 'reports') await renderReports();
                else navigate('dashboard');
                
                const savedTheme = localStorage.getItem('edunexa_theme') || 'dark';
                document.documentElement.dataset.theme = savedTheme;
                const icon = document.getElementById('theme-icon');
                if(icon) icon.className = savedTheme === 'dark' ? 'fa-solid fa-moon text-lg' : 'fa-solid fa-sun text-yellow-500 text-lg';
                Chart.defaults.color = getComputedStyle(document.documentElement).getPropertyValue('--color-text-muted').trim();
                Chart.defaults.font.family = 'Poppins';
            } catch (err) {
                console.error(err);
                if (err.message === 'Unauthorized') {
                    executeLogout(null);
                } else {
                    document.getElementById('app').innerHTML = renderMainLayout(`
                        <div class="glass-card p-8 text-center text-text max-w-lg mx-auto mt-12">
                            <div class="text-red-500 mb-4"><i class="fa-solid fa-triangle-exclamation text-4xl"></i></div>
                            <h2 class="text-2xl font-bold mb-2">Connection Error</h2>
                            <p class="text-textMuted mb-6">EduNexa could not reach the server or failed to load data. The backend service may be down.</p>
                            <button onclick="window.location.reload()" class="bg-primary hover:bg-primaryHover text-white px-6 py-2 rounded font-medium transition">Retry</button>
                        </div>
                    `, 'System Error', 'Service Unavailable');
                }
            } finally {
                hideLoader();
            }
        }
        
        function navigate(path) { location.hash = path; }
        window.addEventListener('hashchange', router);
        window.addEventListener('DOMContentLoaded', router);
    </script>
    <div id="logout-modal" class="fixed inset-0 z-50 hidden items-center justify-center" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="fixed inset-0 bg-black/50 backdrop-blur-sm transition-opacity opacity-0" id="logout-backdrop" onclick="hideLogoutModal()"></div>
        <div class="glass-card relative w-full max-w-sm p-6 transform scale-95 opacity-0 transition-all z-10 m-4 flex flex-col items-center text-center" id="logout-content" tabindex="-1">
            <button onclick="hideLogoutModal()" class="absolute top-4 right-4 text-textMuted hover:text-text transition"><i class="fa-solid fa-xmark text-lg"></i></button>
            <div class="w-12 h-12 rounded-full bg-red-500/10 flex items-center justify-center text-red-500 mb-4">
                <i class="fa-solid fa-arrow-right-from-bracket text-xl"></i>
            </div>
            <h3 id="modal-title" class="text-xl font-bold text-text mb-2">Log out of EduNexa?</h3>
            <p class="text-textMuted text-sm mb-1">You will need to sign in again to access your dashboard.</p>
            <p class="text-text font-medium text-sm mb-6 bg-surfaceHover px-3 py-1.5 rounded-full inline-block" id="logout-user-info"></p>
            <div class="flex w-full gap-3">
                <button onclick="hideLogoutModal()" class="flex-1 px-4 py-2 rounded-lg border border-border text-text hover:bg-surfaceHover transition font-medium" id="logout-cancel">Cancel</button>
                <button onclick="executeLogout(this)" class="flex-1 px-4 py-2 rounded-lg bg-red-500 hover:bg-red-600 text-white transition font-medium" id="logout-confirm">Yes, Log out</button>
            </div>
        </div>
    </div>
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>
</body>
</html>
